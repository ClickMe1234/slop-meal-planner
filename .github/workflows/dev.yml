name: Dev container image

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    name: Verify linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build without publishing
        run: >-
          docker build
          --build-arg APP_VERSION=dev-pr-${{ github.event.number }}
          --build-arg APP_REVISION=${{ github.sha }}
          --tag slop-meal-planner:dev-pr-${{ github.event.number }}
          .

  publish:
    if: github.event_name == 'push'
    name: Build and publish linux/amd64 dev image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish dev image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/clickme1234/slop-meal-planner:dev
            ghcr.io/clickme1234/slop-meal-planner:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=dev
            APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ClickMe1234/slop-meal-planner
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=dev
          provenance: mode=max
          sbom: true
