name: Dev container image

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: dev-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify dev commit before publication
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_DB: meal_planner_ci
          POSTGRES_USER: meal_planner
          POSTGRES_PASSWORD: migration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meal_planner -d meal_planner_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Verify backend migration and dependency gates
        working-directory: backend
        env:
          MEAL_PLANNER_DATABASE_URL: postgresql+psycopg://meal_planner:migration-test-password@127.0.0.1:5432/meal_planner_ci
          MEAL_PLANNER_SETUP_TOKEN: migration-test-setup-token-not-for-production
          MEAL_PLANNER_SECRET_KEY: migration-test-signing-key-not-for-production
        run: |
          python -m pip install pip==26.1.2 setuptools==83.0.0 wheel==0.47.0
          python -m pip install --require-hashes --no-build-isolation -r requirements-dev.lock
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini check
          set +e
          python -m pip_audit -r requirements.lock --format=json --output=/tmp/pip-audit.json
          audit_status=$?
          set -e
          cat /tmp/pip-audit.json
          python ../.github/scripts/check_audit_exceptions.py /tmp/pip-audit.json ../.github/dependency-audit-exceptions.json
          policy_status=$?
          if [ "$audit_status" -ne 0 ] && [ "$policy_status" -eq 0 ]; then exit 0; fi
          exit "$policy_status"

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Verify frontend tests, audit and build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm audit --audit-level=high
          npm run build

      - name: Derive dev image version from VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            version="${version}-pr-${{ github.event.number }}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR for immutable dev verification image
        if: github.event_name != 'pull_request'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build immutable dev verification image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ github.event_name == 'pull_request' && format('slop-meal-planner:dev-pr-{0}', github.event.number) || format('ghcr.io/clickme1234/slop-meal-planner:dev-sha-{0}', github.sha) }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ClickMe1234/slop-meal-planner
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Scan the verified dev image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ github.event_name == 'pull_request' && format('slop-meal-planner:dev-pr-{0}', github.event.number) || format('ghcr.io/clickme1234/slop-meal-planner:dev-sha-{0}', github.sha) }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish:
    if: github.event_name == 'push'
    name: Build and publish linux/amd64 dev image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the verified dev digest
        shell: bash
        run: |
          set -euo pipefail
          source_image="ghcr.io/clickme1234/slop-meal-planner:dev-sha-${GITHUB_SHA}"
          docker buildx imagetools create \
            --tag ghcr.io/clickme1234/slop-meal-planner:dev \
            --tag "ghcr.io/clickme1234/slop-meal-planner:sha-${GITHUB_SHA}" \
            "$source_image"
          docker buildx imagetools inspect "$source_image"
