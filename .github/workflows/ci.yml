name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17.10-bookworm@sha256:4f736ae292687621d4dbe0d499ffd024a36bd2ee7d8ca6f2ccd4c800f047b394
        env:
          POSTGRES_DB: meal_planner_ci
          POSTGRES_USER: meal_planner
          POSTGRES_PASSWORD: migration-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meal_planner -d meal_planner_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        run: |
          python -m pip install pip==26.1.2 setuptools==83.0.0 wheel==0.47.0
          python -m pip install --require-hashes --no-build-isolation -r requirements-dev.lock

      - name: Verify PostgreSQL migration replay and model parity
        env:
          MEAL_PLANNER_DATABASE_URL: postgresql+psycopg://meal_planner:migration-test-password@127.0.0.1:5432/meal_planner_ci
          MEAL_PLANNER_SETUP_TOKEN: migration-test-setup-token-not-for-production
          MEAL_PLANNER_SECRET_KEY: migration-test-signing-key-not-for-production
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini check
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head

      - name: Run backend tests
        run: python -m pytest

      - name: Audit backend production dependencies
        run: python -m pip_audit -r requirements.lock

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm test

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Build frontend
        run: npm run build

  container:
    name: Production image build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build linux/amd64 image without publishing
        run: >-
          docker build
          --build-arg APP_VERSION=1.1.0
          --build-arg APP_REVISION=${{ github.sha }}
          --tag slop-meal-planner:ci
          .

      - name: Scan production image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: slop-meal-planner:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    name: Create GitHub release
    needs:
      - backend
      - frontend
      - container
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create release when VERSION is not tagged
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(tr -d '\r\n' < VERSION)"
          tag="v${version}"

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION is not valid SemVer: $version" >&2
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
            exit 0
          fi

          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
