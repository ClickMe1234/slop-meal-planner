name: Container image

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name == 'pull_request'
    name: Verify linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build without publishing
        run: >-
          docker build
          --build-arg APP_VERSION=1.0.0-pr-${{ github.event.number }}
          --build-arg APP_REVISION=${{ github.sha }}
          --tag slop-meal-planner:pr-${{ github.event.number }}
          .

  publish:
    if: github.event_name != 'pull_request'
    name: Build and publish linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          
          if [[ "$EVENT_NAME" == "release" ]]; then
            [[ "$RELEASE_TAG" == "v${version}" ]] || {
              echo "Release tag ${RELEASE_TAG} does not match v${version}" >&2
              exit 1
            }
            image_tag="${version}"
          elif [[ "$EVENT_NAME" == "push" ]]; then
            image_tag="latest"
          else
            version="${version}-pr-${PR_NUMBER}"
            image_tag="${version}"
          fi
          
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GHCR
        if: github.event_name == 'release' || github.event_name == 'push'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name == 'release' || github.event_name == 'push' }}
          tags: |
            ghcr.io/clickme1234/slop-meal-planner:${{ steps.version.outputs.image_tag }}
            ghcr.io/clickme1234/slop-meal-planner:sha-${{ github.sha }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/ClickMe1234/slop-meal-planner
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          provenance: mode=max
          sbom: true
